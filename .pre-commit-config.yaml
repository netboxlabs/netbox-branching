---
# Pre-commit configuration, following netbox-plugin-scaffold.
# Tool-level config lives in pyproject.toml.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-ast
      - id: check-docstring-first
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args: [--unsafe]
        files: \.(yaml|yml)$
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: name-tests-test
        args: ["--django"]
        # utils.py holds shared helpers, not test cases.
        exclude: '(^|/)tests/(?:.+/)?(base|plugin_testing|utils)\.py$'
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1.30.0
    hooks:
      - id: django-upgrade
        args: [--target-version, "5.2"]

  - repo: https://github.com/djlint/djLint
    rev: v1.36.4
    hooks:
      - id: djlint-django
      - id: djlint-reformat-django

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        additional_dependencies: [tomli]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        files: \.(yaml|yml)$
        # .copier-answers.yml is auto-generated by Copier (to_nice_yaml) and
        # is not hand-edited; its formatting is not under maintainer control.
        exclude: ^\.copier-answers\.yml$

  - repo: https://github.com/mgedmin/check-manifest
    rev: "0.51"
    hooks:
      - id: check-manifest
        stages: [manual]

  - repo: local
    hooks:
      - id: mkdocs-build
        name: "Build documentation"
        description: "Build the documentation with mkdocs"
        files: '^(docs/|mkdocs\.yml$)'
        entry: .hooks/mkdocs-build.sh
        language: system
        pass_filenames: false
