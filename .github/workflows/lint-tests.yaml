name: Lint and tests
on:
  workflow_dispatch:
    inputs:
      netbox_ref:
        description: 'NetBox ref to checkout (branch, tag, or commit)'
        required: false
        default: 'main'
        type: string
  pull_request:
  push:
    # PR branches are already covered by the pull_request trigger; without this
    # filter every push to a PR branch runs the whole matrix twice.
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  # Keyed per ref so unrelated PRs run side by side instead of queueing behind
  # one another, and superseded runs on the same ref are cancelled.
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; pushes to main and tags always run to
  # completion so every landed commit keeps a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/lint-tests.yaml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install .[dev]
          pip install .[test]
      - name: Build documentation
        run: mkdocs build
      - name: Run ruff
        run: ruff check
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: [ "3.12", "3.13", "3.14" ]
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      postgres:
        # Pinned: the tag was unpinned and had silently moved to 18, which also
        # relocated PGDATA (17: /var/lib/postgresql/data, 18:
        # /var/lib/postgresql/18/docker). The tmpfs below mounts the shared
        # parent so it stays correct across either layout.
        image: postgres:18
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
        options: >-
          --mount type=tmpfs,destination=/var/lib/postgresql
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout netbox-branching
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: netbox-branching
      - name: Get NetBox ref from PR labels
        id: netbox-ref
        run: |
          DEFAULT_REF="main"
          # Check for label like "test-against:main" or "test-against:v4.7.0"
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          echo "Labels: $LABELS"
          # Extract ref from label (format: "test-against:branch-name")
          REF=$(echo "$LABELS" | jq -r '.[] | select(startswith("test-against:")) | split(":")[1]' | head -n1)
          if [[ -n "$REF" && "$REF" != "null" ]]; then
            echo "Found test-against label: $REF"
            echo "ref=$REF" >> $GITHUB_OUTPUT
          else
            echo "No test-against label found, using $DEFAULT_REF"
            echo "ref=$DEFAULT_REF" >> $GITHUB_OUTPUT
          fi
      - name: Checkout netbox
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "netbox-community/netbox"
          ref: ${{ inputs.netbox_ref || steps.netbox-ref.outputs.ref }}
          path: netbox
      # After both checkouts so the pip cache key can hash their dependency files.
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            netbox/requirements.txt
            netbox-branching/pyproject.toml
            netbox-branching/.github/workflows/lint-tests.yaml
      - name: Use prebuilt psycopg wheels
        working-directory: netbox
        run: |
          # Skips compiling psycopg against libpq; the version pin is unchanged.
          sed -i 's/^psycopg\[c,pool\]==/psycopg[binary,pool]==/' requirements.txt
          grep -q '^psycopg\[binary,pool\]==' requirements.txt \
            || { echo "::error::NetBox's requirements.txt no longer pins psycopg[c,pool]=="; exit 1; }
      - name: Install netbox-branching
        working-directory: netbox-branching
        run: |
          # Include tests directory for test
          sed -i 's/exclude-package-data/#exclude-package-data/g' pyproject.toml
          python -m pip install --upgrade pip
          pip install .
          pip install .[test]
      - name: Install dependencies & configure plugin
        working-directory: netbox
        run: |
          ln -s $(pwd)/../netbox-branching/testing/configuration.py netbox/netbox/configuration.py
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fingerprint the schema inputs
        id: schema
        run: |
          # Path and blob of every file that shapes the migrated schema, so renames count too.
          # NetBox is checked out at a moving ref, so its schema inputs are hashed, not its SHA.
          netbox_inputs=$(git -C netbox ls-files --stage -- \
            requirements.txt \
            netbox/netbox/settings.py \
            netbox/core/signals.py \
            ':(glob)netbox/**/migrations/**' \
            ':(glob)netbox/*/fields.py' \
            netbox/netbox/models/ltree.py \
            netbox/ipam/lookups.py \
            netbox/utilities/query_functions.py \
            netbox/utilities/ltree.py \
            netbox/utilities/migration.py \
            netbox/utilities/mptt_to_ltree.py)
          branching_inputs=$(git -C netbox-branching ls-files --stage -- \
            .github/workflows/lint-tests.yaml \
            pyproject.toml \
            testing/configuration.py \
            ':(glob)netbox_branching/migrations/**')
          echo "hash=$(sha256sum <<< "$netbox_inputs$branching_inputs" | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - name: Restore the migrated test database
        id: test-db
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test_netbox.dump
          key: test-db-py${{ matrix.python-version }}-${{ steps.schema.outputs.hash }}
          # Pushes to main and release tags migrate from scratch, re-validating the migration chain.
          lookup-only: ${{ github.event_name == 'push' }}
      - name: Build the migrated test database
        if: github.event_name == 'push' || steps.test-db.outputs.cache-hit != 'true'
        working-directory: netbox
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          python netbox/manage.py migrate --no-input --run-syncdb
          docker exec "$POSTGRES_CONTAINER" pg_dump -U netbox -Fc netbox > "$RUNNER_TEMP/test_netbox.dump"
      - name: Load the test database
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_CONTAINER" createdb -U netbox test_netbox
          docker exec -i "$POSTGRES_CONTAINER" pg_restore -U netbox -d test_netbox --exit-on-error \
            < "$RUNNER_TEMP/test_netbox.dump"
      - name: Cache the migrated test database
        if: steps.test-db.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/test_netbox.dump
          key: ${{ steps.test-db.outputs.cache-primary-key }}
      - name: Run tests
        working-directory: netbox
        run: |
          python netbox/manage.py test netbox_branching.tests --keepdb --timing
