schema_version: 1

package_name: netboxlabs-netbox-branching
plugin_name: netbox_branching

netbox_min: "4.7.0"
netbox_max: "4.7.99"

config:
  required_settings: []
  default_settings:
    max_working_branches: null
    max_branches: null
    exempt_models: []
    main_schema: public
    schema_prefix: branch_
    job_timeout: 3600
    provision_workers: 4
    sync_validators: []
    merge_validators: []
    migrate_validators: []
    revert_validators: []
    archive_validators: []
    stale_warning_threshold: 7
    auto_archive_days: null
    auto_recover_stuck_branches: true
    stuck_job_grace_period: 300
