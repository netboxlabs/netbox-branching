{% load helpers %}
{% load i18n %}
<div class="card border-{{ color }}">
  <h2 class="card-header text-{{ color }}">{{ title }}</h2>
  <div class="list-group list-group-flush">
    {% for ct, count in counts.items %}
      <a href="{% url 'plugins:netbox_branching:branch_changes-ahead' pk=object.pk %}?action={{ action }}&changed_object_type_id={{ ct.pk }}"
         class="list-group-item list-group-item-action d-flex justify-content-between">
        {{ ct.model_class|meta:"verbose_name_plural"|bettertitle }}
        <span class="badge text-bg-primary rounded-pill">{{ count }}</span>
      </a>
    {% empty %}
      <div class="list-group-item text-muted">{% translate "No changes" %}</div>
    {% endfor %}
  </div>
</div>
